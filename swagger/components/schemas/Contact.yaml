type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: 'Unique contact identifier'
    type: string
    example: '6790e807bda0630f98bbffd4'
  name:
    description: 'Contact name'
    type: string
    example: 'Brad Jackson'
  phoneNumber:
    description: 'The phone number of the contact'
    type: string
    example: '+380123456789'
  email:
    description: 'Email address of the contact'
    type: string
    example: 'john.doe@example.com'
  contactType:
    description: 'Type of the contact'
    type: string
    example: 'personal'
    enum: ['work', 'home', 'personal']
  isFavourite:
    description: 'Indicates if the contact is a favorite'
    type: boolean
  userId:
    description: 'Identifier for the user to whom the contact belongs'
    type: string
    example: '67916e940bc78c27973fdff9'
  photo:
    description: 'Link to the contact’s image'
    type: string
    example: 'https://res.cloudinary.com/dvb7eqx9j/image/upload/v1737584370/photo/vh…'